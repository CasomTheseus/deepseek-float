name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          uname -m
          swiftc --version
      - name: Build and test
        run: ./build.sh test
      - name: Package app
        run: ./build.sh package
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict build/DeepSeekFloat.app
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekFloat-macos-arm64
          path: build/DeepSeekFloat.zip
          retention-days: 7
